name: PR Checks

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.github/**/*.yml'
      - 'charts/**'

concurrency:
  group: test-dependencies-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-app:
    uses: ./.github/workflows/test-node-app.yml
    with:
      ref: ${{ github.sha }}

  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64/v8
          push: false

  test-chart:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Update chart dependencies
        run: helm dependency update ./charts/discord-peter
      - name: Lint chart
        run: helm lint ./charts/discord-peter
      - name: Create kind cluster
        uses: helm/kind-action@v1.15.1
      - name: Install chart with a disabled bot
        run: |
          helm upgrade --install discord-peter ./charts/discord-peter \
            --wait --timeout 5m \
            --set replicaCount=0
