name: PR Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm test

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: azure/setup-helm@v5
      - run: helm dependency build ./charts/discord-peter
      - run: helm lint ./charts/discord-peter
      - run: helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false
      - run: helm unittest ./charts/discord-peter

  chart-integration:
    needs: [node]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: helm/kind-action@v1.15.2
      - uses: azure/setup-helm@v5
      - name: Run bundled and external Redis scenarios
        run: bash .github/scripts/test-chart-integration.sh

  # Preserve the required build-image status; chart-integration already builds
  # the same amd64 image and exercises it in a cluster.
  build-image:
    needs: [node, chart, chart-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm image build succeeded
        run: echo "The chart integration job built and exercised the application image."
