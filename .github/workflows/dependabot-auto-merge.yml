name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [Dependabot PR]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  approve-and-merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default branch revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Approve and enable auto-merge for the tested Dependabot revision
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: bash .github/scripts/dependabot-auto-merge.sh
