suite: secrets
templates:
  - templates/secret.yaml
tests:
  - it: base64 encodes secret values
    set:
      secrets.discordToken: test-token
      secrets.geminiApiKey: test-key
    asserts:
      - equal:
          path: data.DISCORD_TOKEN
          value: dGVzdC10b2tlbg==
      - equal:
          path: data.GEMINI_API_KEY
          value: dGVzdC1rZXk=
