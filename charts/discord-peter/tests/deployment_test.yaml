suite: deployment redis endpoint and overrides
templates:
  - templates/deployment.yaml
tests:
  - it: waits for bundled Redis by configured URL
    asserts:
      - contains:
          path: spec.initContainers[0].envFrom[0].configMapRef.name
          content: discord-peter-config
      - contains:
          path: spec.initContainers[0].command[2]
          content: REDIS_URL
      - contains:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          content: secrets
      - contains:
          path: spec.template.spec.containers[0].envFrom[1].configMapRef.name
          content: config
  - it: uses default image, replicas, resources and matching selectors
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/nikolayrk/discord-peter:latest
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
      - equal:
          path: spec.selector.matchLabels.app\.kubernetes\.io/name
          value: discord-peter
      - equal:
          path: spec.template.metadata.labels.app\.kubernetes\.io/name
          value: discord-peter
  - it: accepts image, replica, resource and naming overrides
    set:
      replicaCount: 3
      image.repository: example.test/peter
      image.tag: offline
      fullnameOverride: peter-test
      resources.requests.cpu: 250m
    asserts:
      - equal:
          path: metadata.name
          value: peter-test
      - equal:
          path: spec.replicas
          value: 3
      - equal:
          path: spec.template.spec.containers[0].image
          value: example.test/peter:offline
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 250m
  - it: uses the configured application command and arguments
    set:
      command: ["node"]
      args: ["dist/harness.js"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command[0]
          value: node
      - equal:
          path: spec.template.spec.containers[0].args[0]
          value: dist/harness.js
