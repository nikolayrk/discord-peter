apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "discord-peter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "discord-peter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "discord-peter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "discord-peter.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          envFrom:
            - configMapRef:
                name: {{ include "discord-peter.fullname" . }}-config
          command:
            - 'sh'
            - '-c'
            - >
              redis_host="${REDIS_URL#*://}";
              redis_host="${redis_host%%:*}";
              redis_port="${REDIS_URL##*:}";
              redis_port="${redis_port%%/*}";
              until nc -z -w 2 "$redis_host" "$redis_port"; do
                echo "Waiting for Redis...";
                sleep 2;
              done;
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "discord-peter.fullname" . }}-secrets
            - configMapRef:
                name: {{ include "discord-peter.fullname" . }}-config
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
